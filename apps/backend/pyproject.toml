[project]
name = "fittrack-backend"
version = "0.1.0"
description = "FastAPI backend for FitTrack V1"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.1.2",
  "email-validator>=2.2.0",
  "fastapi[standard]>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.9.0",
  "sqlalchemy>=2.0.35"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
